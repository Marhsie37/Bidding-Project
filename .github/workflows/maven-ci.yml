name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'liberica'
          architecture: x64
          java-package: jdk+fx
          cache: maven

      - name: Install xvfb
        run: sudo apt-get install -y xvfb

      - name: Build and Run Tests
        run: xvfb-run mvn -B clean install

      - name: Archive Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: auction-system-build
          path: |
            server/target/*.jar
            client/target/*.jar