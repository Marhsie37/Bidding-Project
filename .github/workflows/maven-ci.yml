name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'liberica'
          java-package: jdk+fx
          cache: maven

      - name: Install xvfb & graphics dependencies (Tạo màn hình ảo và thư viện cho JavaFX)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb libgtk-3-0 libglu1-mesa libpango-1.0-0 libasound2t64

      # --- CẬP NHẬT: THÊM CÁC THAM SỐ ĐỒ HỌA ẢO KHI CHẠY TEST ---
      - name: Build and Run Tests
        run: |
          xvfb-run --auto-servernum mvn -B test \
            -Dglass.platform=Monocle \
            -Dmonocle.platform=Headless \
            -Dprism.order=sw \
            -Dtestfx.robot=glass \
            -Dtestfx.headless=true \
            -Djava.awt.headless=true \
            -Dsurefire.useModulePath=false \
            -Dsurefire.argLine="\
              --add-opens javafx.graphics/com.sun.javafx.application=ALL-UNNAMED \
              --add-opens javafx.graphics/com.sun.glass.ui=ALL-UNNAMED \
              --add-opens javafx.controls/com.sun.javafx.scene.control=ALL-UNNAMED \
              --add-exports javafx.graphics/com.sun.javafx.application=ALL-UNNAMED \
              --add-exports javafx.graphics/com.sun.glass.ui.monocle=ALL-UNNAMED"

      - name: Package Application
        if: success()
        run: mvn -B package -DskipTests

      - name: Archive Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: auction-system-build
          path: "**/target/*.jar"